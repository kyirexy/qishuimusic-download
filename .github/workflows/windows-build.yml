name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-lock.txt

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build and check Windows package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Output 'FFmpeg is not installed on this runner. Audio integration tests will report skipped; FFmpeg is never bundled.'
          }
          & .\build.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SodaMusicDownloader-v${{ steps.version.outputs.version }}-windows-x64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

# This workflow builds artifacts only. Publishing a GitHub Release is a
# separate, explicitly requested operation; this workflow has no write token.
