name: Windows build

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: "1.0.0"
        type: string
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11.9"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-lock.txt

      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME -replace '^v', '' } else { $env:INPUT_VERSION }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') { throw 'Invalid release version.' }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare FFmpeg 8.1.1 for tests
        run: |
          $ffmpegArchive = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.1.1-full_build.zip'
          $ffmpegDirectory = Join-Path $env:RUNNER_TEMP 'ffmpeg-test-bin'
          # Fixed upstream release and SHA-256 from the Gyan.FFmpeg 8.1.1 WinGet manifest.
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.1/ffmpeg-8.1.1-full_build.zip' -OutFile $ffmpegArchive
          $expectedHash = '49B28C5F16ADDD40239A66949973458769B7056FB7752C30AC0D53389D09A552'
          if ((Get-FileHash -LiteralPath $ffmpegArchive -Algorithm SHA256).Hash -ne $expectedHash) { throw 'FFmpeg archive checksum mismatch.' }
          New-Item -ItemType Directory -Path $ffmpegDirectory -Force | Out-Null
          $archive = [IO.Compression.ZipFile]::OpenRead($ffmpegArchive)
          try {
            foreach ($name in @('ffmpeg.exe', 'ffprobe.exe')) {
              $entries = @($archive.Entries | Where-Object { $_.FullName.Replace('\', '/') -eq "ffmpeg-8.1.1-full_build/bin/$name" })
              if ($entries.Count -ne 1) { throw "Missing or ambiguous FFmpeg executable: $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], (Join-Path $ffmpegDirectory $name), $false)
            }
          } finally { $archive.Dispose() }
          $ffmpegDirectory | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build and check Windows package
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue) -or -not (Get-Command ffprobe -ErrorAction SilentlyContinue)) {
            throw 'FFmpeg and FFprobe are required for the complete CI test suite.'
          }
          & .\build.ps1 -Version $env:RELEASE_VERSION

      - name: Upload release candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SodaMusicDownloader-v${{ steps.version.outputs.version }}-windows-x64
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

# This workflow builds artifacts only. Publishing a GitHub Release is a
# separate, explicitly requested operation; this workflow has no write token.
